name: XSJ Dispatch ROCm (gfx1151 Strix Halo, gfx1201 Radeon R9700)

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/xsj-rocm-gfx1151-gfx1201
    paths:
      - '.github/workflows/xsj-dispatch-rocm.yml'

jobs:
  gfx1201-radeon-r9700:
    runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]

    env:
      ROCM_VERSION: "10.0.0"

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      # The host has ROCm 7.2.4, whose clang emits a wavefront-shift DPP
      # instruction gfx1201 does not have in the mmf kernels. Build with the
      # TheRock toolchain release.yml uses instead.
      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/rocm"
          "$RUNNER_TEMP/rocm/bin/python" -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel,device-gfx1201]==${ROCM_VERSION}"
          ROCM_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --root)
          {
            echo "ROCM_PATH=$ROCM_PATH"
            echo "HIP_PATH=$ROCM_PATH"
            echo "CMAKE_PREFIX_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --cmake)"
            echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rocm/bin/rocm-sdk" path --bin >> "$GITHUB_PATH"

      - name: Test
        id: ggml-ci
        run: |
          rocminfo
          GG_BUILD_ROCM=1 GG_BUILD_AMDGPU_TARGETS=gfx1201 bash ./ci/run.sh ~/results/llama.cpp ~/mnt/llama.cpp

  gfx1151-strix-halo:
    # The one Linux Strix Halo host with a build toolchain. It has no system
    # ROCm, so ROCm comes from TheRock wheels, gfx1151 kernels included.
    runs-on: [self-hosted, Linux, xsj-dispatch, strix-halo, host-sjlab-stx-halo-19]

    env:
      ROCM_VERSION: "10.0.0"

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/rocm"
          "$RUNNER_TEMP/rocm/bin/python" -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel,device-gfx1151]==${ROCM_VERSION}"
          ROCM_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --root)
          {
            echo "ROCM_PATH=$ROCM_PATH"
            echo "HIP_PATH=$ROCM_PATH"
            echo "CMAKE_PREFIX_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --cmake)"
            echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rocm/bin/rocm-sdk" path --bin >> "$GITHUB_PATH"
          # ci/run.sh checks for pip3, which this host lacks.
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf "$RUNNER_TEMP/rocm/bin/pip3" "$RUNNER_TEMP/bin/pip3" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test
        id: ggml-ci
        # HIP_LAUNCH_BLOCKING=1: workaround for an async-execution correctness
        # issue on integrated RDNA3.5 (gfx1151), as in ci-self-hosted-cuda.yml.
        env:
          HIP_LAUNCH_BLOCKING: "1"
        run: |
          rocminfo
          GG_BUILD_ROCM=1 GG_BUILD_AMDGPU_TARGETS=gfx1151 bash ./ci/run.sh ~/results/llama.cpp ~/mnt/llama.cpp
