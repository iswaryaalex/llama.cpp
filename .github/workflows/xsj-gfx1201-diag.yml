name: XSJ gfx1201 diagnostic (R9700)

# test-tiled-mulmat (CPU backend only: tiled vs reference CPU matmul) fails
# intermittently in Release on the R9700 VM (iq2_xs, then iq2_xxs) and passes
# on bare-metal Strix Halo. Loop it on both to see whether it is the VM's CPU.

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/gfx1201-diag
    paths:
      - '.github/workflows/xsj-gfx1201-diag.yml'

jobs:
  tiled:
    name: static test-tiled-mulmat for the Proxmox host
    runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]
    timeout-minutes: 30
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Static native Release build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF
          cmake --build build -j "$(nproc)" --target test-tiled-mulmat
          ldd build/bin/test-tiled-mulmat || true
          f=0; for i in $(seq 1 10); do ./build/bin/test-tiled-mulmat > /dev/null 2>&1 || f=$((f+1)); done; echo "RESULT in VM: $f of 10 failed"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-tiled-mulmat-static
          path: build/bin/test-tiled-mulmat
