name: XSJ gfx1201 diagnostic (R9700)

# test-llama-context, test-speculative-rejection-sampling and
# test-thread-safety fail on the R9700 with "the operation cannot be performed
# in the present state" (hipErrorIllegalState). All three drive several
# contexts from parallel threads, and HIP graphs (stream capture) are on by
# default. One job turns graphs off; the other keeps them on and logs every HIP
# call to find the one that fails.

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/gfx1201-diag
    paths:
      - '.github/workflows/xsj-gfx1201-diag.yml'

jobs:
  diag:
    name: gfx1201 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: graphs off
            tests: 'test-llama-context|test-speculative-rejection-sampling|test-thread-safety'
            disable_graphs: "1"
            log_level: "0"
          - name: graphs on, HIP API log
            tests: 'test-llama-context'
            disable_graphs: ""
            log_level: "4"
    runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]
    timeout-minutes: 90
    env:
      ROCM_VERSION: "10.0.0"

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/rocm"
          "$RUNNER_TEMP/rocm/bin/python" -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel,device-gfx1201]==${ROCM_VERSION}"
          ROCM_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --root)
          {
            echo "ROCM_PATH=$ROCM_PATH"
            echo "HIP_PATH=$ROCM_PATH"
            echo "CMAKE_PREFIX_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --cmake)"
            echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rocm/bin/rocm-sdk" path --bin >> "$GITHUB_PATH"

      - name: Build (Debug, as ci/run.sh ctest_debug)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLAMA_FATAL_WARNINGS=ON -DLLAMA_OPENSSL=OFF \
            -DGGML_SCHED_NO_REALLOC=ON -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" -DGGML_HIP=ON -DGPU_TARGETS=gfx1201
          cmake --build build -j "$(nproc)"

      - name: Tests
        run: |
          [ -n "${{ matrix.disable_graphs }}" ] && export GGML_CUDA_DISABLE_GRAPHS=1
          export AMD_LOG_LEVEL=${{ matrix.log_level }}
          [ "$AMD_LOG_LEVEL" != 0 ] && export AMD_LOG_LEVEL_FILE="$RUNNER_TEMP/hip-api.log"
          cd build
          set +e
          ctest -L main -R '${{ matrix.tests }}' --output-on-failure --timeout 900 > "$RUNNER_TEMP/ctest.log" 2>&1
          rc=$?
          set -e
          grep -nE "Test +#|tests passed|ROCm error|in function" "$RUNNER_TEMP/ctest.log" | head -40
          if [ -f "$RUNNER_TEMP/hip-api.log" ]; then
            ls -l "$RUNNER_TEMP/hip-api.log"
            echo "--- first non-success HIP returns"
            grep -nE "Returned hip(Error|ErrorIllegalState)|hipErrorIllegalState|IllegalState" "$RUNNER_TEMP/hip-api.log" | grep -v "hipSuccess" | head -10
            first=$(grep -nE "hipErrorIllegalState" "$RUNNER_TEMP/hip-api.log" | head -1 | cut -d: -f1)
            if [ -n "$first" ]; then
              echo "--- 60 lines before line $first"
              sed -n "$((first-60)),$((first+5))p" "$RUNNER_TEMP/hip-api.log" | cut -c1-300
            fi
            gzip -k "$RUNNER_TEMP/hip-api.log"
          fi
          exit $rc

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx1201-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/hip-api.log.gz
          if-no-files-found: ignore
