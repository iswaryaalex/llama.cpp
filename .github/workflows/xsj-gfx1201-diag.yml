name: XSJ gfx1201 diagnostic (R9700)

# test-tiled-mulmat (CPU backend only: tiled vs reference CPU matmul) fails
# intermittently in Release on the R9700 VM (iq2_xs, then iq2_xxs) and passes
# on bare-metal Strix Halo. Loop it on both to see whether it is the VM's CPU.

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/gfx1201-diag
    paths:
      - '.github/workflows/xsj-gfx1201-diag.yml'

jobs:
  tiled:
    name: tiled-mulmat x30 on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: R9700 VM
            runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]
          - name: halo-19 bare metal
            runs-on: [self-hosted, Linux, xsj-dispatch, strix-halo, host-sjlab-stx-halo-19]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: CPU-only Release build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_OPENSSL=OFF -DGGML_SCHED_NO_REALLOC=ON
          cmake --build build -j "$(nproc)" --target test-tiled-mulmat

      - name: Loop
        run: |
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) x$(nproc); flags: $(grep -m1 -o 'avx512[a-z_]*' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          fails=0
          for i in $(seq 1 30); do
            if ! ./build/bin/test-tiled-mulmat > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              fails=$((fails+1))
              echo "run $i FAIL: $(grep -m2 'FAIL' "$RUNNER_TEMP/run-$i.log" | tr '\n' ' ')"
            fi
          done
          echo "RESULT: $fails of 30 runs failed"
          echo "--- one run single-threaded (GGML_N_THREADS has no effect here; OMP_NUM_THREADS=1)"
          fails1=0
          for i in $(seq 1 10); do OMP_NUM_THREADS=1 ./build/bin/test-tiled-mulmat > /dev/null 2>&1 || fails1=$((fails1+1)); done
          echo "RESULT single-thread: $fails1 of 10 runs failed"
