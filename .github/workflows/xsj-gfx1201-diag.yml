name: XSJ gfx1201 diagnostic (R9700)

# test-llama-context, test-speculative-rejection-sampling and
# test-thread-safety fail on the R9700 with "the operation cannot be performed
# in the present state" (hipErrorIllegalState). All three drive several
# contexts from parallel threads, and HIP graphs (stream capture) are on by
# default. Atomics fixed (r9700-gpu mapping); now testing hipBLASLt under graph capture.

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/gfx1201-diag
    paths:
      - '.github/workflows/xsj-gfx1201-diag.yml'

jobs:
  diag:
    name: gfx1201 parallelism and HIP log
    runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]
    timeout-minutes: 90
    env:
      ROCM_VERSION: "10.0.0"

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv "$RUNNER_TEMP/rocm"
          "$RUNNER_TEMP/rocm/bin/python" -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel,device-gfx1201]==${ROCM_VERSION}"
          ROCM_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --root)
          {
            echo "ROCM_PATH=$ROCM_PATH"
            echo "HIP_PATH=$ROCM_PATH"
            echo "CMAKE_PREFIX_PATH=$("$RUNNER_TEMP/rocm/bin/rocm-sdk" path --cmake)"
            echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/rocm/bin/rocm-sdk" path --bin >> "$GITHUB_PATH"

      - name: Build (Debug, as ci/run.sh ctest_debug)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLAMA_FATAL_WARNINGS=ON -DLLAMA_OPENSSL=OFF \
            -DGGML_SCHED_NO_REALLOC=ON -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" -DGGML_HIP=ON -DGPU_TARGETS=gfx1201
          cmake --build build -j "$(nproc)"

      - name: Fixtures (generated models, downloaded model)
        run: |
          cd build
          ctest -R 'test-generate-models|test-download-model' --output-on-failure
          ctest -N -V -R '^(test-llama-context|test-thread-safety)$' | grep -E "Test command:" | tee "$RUNNER_TEMP/cmds.txt"

      - name: Parallelism and HIP log
        env:
          GGML_SCHED_DEBUG_REALLOC: "1"
        run: |
          set +e
          cd build
          ctx="bin/test-llama-context --models tests/test-models/"
          ts="bin/test-thread-safety -m tinyllamas/stories15M-q4_0.gguf -ngl 99 -p hello -n 128 -c 256 -ub 32 -t 2 -np"
          run() { local name=$1; shift; timeout 600 "$@" > "$RUNNER_TEMP/$name.log" 2>&1; local rc=$?; echo "RESULT $name: exit $rc ($(grep -c 'ROCm error' "$RUNNER_TEMP/$name.log") ROCm errors)"; }
          ops="bin/test-backend-ops -o MUL_MAT -b ROCm0"
          run mm-default $ops
          ROCBLAS_USE_HIPBLASLT=0 run mm-nohipblaslt $ops
          GGML_CUDA_DISABLE_GRAPHS=1 run mm-nographs $ops
          GGML_CUDA_DISABLE_GRAPHS=1 run ctx-nographs $ctx
          for f in mm-default mm-nohipblaslt mm-nographs ctx-nographs; do
            echo "--- $f"; grep -hE "tests passed|FAIL|Hip error|ROCm error" "$RUNNER_TEMP/$f.log" | grep -v "OK$" | head -6
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx1201-diag-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ctx-hip.log.gz
          if-no-files-found: ignore
