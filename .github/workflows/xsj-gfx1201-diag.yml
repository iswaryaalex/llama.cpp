name: XSJ gfx1201 diagnostic (R9700)

# test-tiled-mulmat (CPU backend only: tiled vs reference CPU matmul) fails
# intermittently in Release on the R9700 VM (iq2_xs, then iq2_xxs) and passes
# on bare-metal Strix Halo. Loop it on both to see whether it is the VM's CPU.

on:
  workflow_dispatch:
  push:
    branches:
      - rradjabi/gfx1201-diag
    paths:
      - '.github/workflows/xsj-gfx1201-diag.yml'

jobs:
  tiled:
    name: tiled-mulmat on R9700 VM, isolate the cause
    runs-on: [self-hosted, Linux, xsj-dispatch, radeon-r9700]
    timeout-minutes: 60
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Builds (native, and AVX2 without AVX-512)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_OPENSSL=OFF
          cmake --build build -j "$(nproc)" --target test-tiled-mulmat
          cmake -B build-avx2 -DCMAKE_BUILD_TYPE=Release -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF
          cmake --build build-avx2 -j "$(nproc)" --target test-tiled-mulmat

      - name: Loops
        run: |
          uname -r; grep -m1 'model name' /proc/cpuinfo; nproc
          loop() { local name=$1 n=$2; shift 2; local f=0; for i in $(seq 1 $n); do "$@" > /dev/null 2>&1 || f=$((f+1)); done; echo "RESULT $name: $f of $n failed"; }
          loop native            20 ./build/bin/test-tiled-mulmat
          loop avx2-no-avx512    20 ./build-avx2/bin/test-tiled-mulmat
          loop native-pinned-cpu0 20 taskset -c 0 ./build/bin/test-tiled-mulmat
          loop native-pinned-cpu0-3 20 taskset -c 0-3 ./build/bin/test-tiled-mulmat
